<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Farscreen</title>
  <desc id="desc">Farscreen: low-latency remote desktop for Mac. View or control another Mac at up to 6K and 120 fps, on your network or across the internet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#261D19"/>
      <stop offset="1" stop-color="#110E0C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.48" r="0.42">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="0" r="0.55">
      <stop offset="0" stop-color="#E58A6A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E58A6A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E58A6A"/>
      <stop offset="0.5" stop-color="#D97757"/>
      <stop offset="1" stop-color="#B9573A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#D97757" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#F7F1EA" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="440" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#dots)"/>
    <rect width="1280" height="440" fill="url(#glow)"/>
    <rect width="1280" height="440" fill="url(#glow2)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="27.5" fill="none" stroke="#F7F1EA" stroke-opacity="0.09"/>
