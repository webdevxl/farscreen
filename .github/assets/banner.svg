  <text x="80" y="242" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#F7F1EA">Low-latency remote desktop for Mac</text>
  <text x="80" y="280" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#BDAFA4">On your network or across the internet. No router setup.</text>
