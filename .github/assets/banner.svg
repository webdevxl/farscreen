  <rect x="560" y="318" width="148" height="36" rx="18" fill="#F7F1EA" fill-opacity="0.06" stroke="#F7F1EA" stroke-opacity="0.14"/>
  <text x="634.0" y="341.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E9DED5">Open source</text>
